server.port=${PORT:8080}

# --- Monitoring database (overridden by environment variables in Docker) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/monitoring_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres_the_superuser}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- Two independent RabbitMQ brokers (see config/RabbitConfig) ---
# Data Collection Broker: smart meter measurements sent by the Device Data Simulator
app.rabbit.data.host=${DATA_MQ_HOST:localhost}
app.rabbit.data.port=${DATA_MQ_PORT:5672}
app.rabbit.data.username=${DATA_MQ_USER:guest}
app.rabbit.data.password=${DATA_MQ_PASSWORD:guest}
app.rabbit.data.queue=${DATA_MQ_QUEUE:device-measurements}
# Synchronization Broker: user / device events published by the other microservices
app.rabbit.sync.host=${SYNC_MQ_HOST:localhost}
app.rabbit.sync.port=${SYNC_MQ_PORT:5673}
app.rabbit.sync.username=${SYNC_MQ_USER:guest}
app.rabbit.sync.password=${SYNC_MQ_PASSWORD:guest}
app.rabbit.sync.exchange=sync.events
app.rabbit.sync.queue=sync.monitoring-service.devices

# --- Swagger: paths live under /api/monitoring so the reverse proxy rule covers them ---
springdoc.api-docs.path=/api/monitoring/v3/api-docs
springdoc.swagger-ui.path=/api/monitoring/swagger-ui.html

logging.level.root=INFO
logging.level.ro.tuc=DEBUG
