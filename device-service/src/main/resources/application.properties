server.port=${PORT:8080}

# --- Database (overridden by environment variables in Docker) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/device_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- Synchronization Broker (RabbitMQ) ---
# publishes device.created / device.updated / device.deleted, consumes user.* into its local user table
spring.rabbitmq.host=${SYNC_MQ_HOST:localhost}
spring.rabbitmq.port=${SYNC_MQ_PORT:5673}
spring.rabbitmq.username=${SYNC_MQ_USER:guest}
spring.rabbitmq.password=${SYNC_MQ_PASSWORD:guest}
# a poison message is dropped instead of being redelivered forever
spring.rabbitmq.listener.simple.default-requeue-rejected=false
app.rabbit.sync.exchange=sync.events
app.rabbit.sync.queue=sync.device-service.users

# --- Inter-service communication (Docker network DNS name) ---
user.service.url=${USER_SERVICE_URL:http://localhost:8081}

# --- Swagger: paths live under /api/devices so the reverse proxy rule PathPrefix(/api/devices) covers them ---
springdoc.api-docs.path=/api/devices/v3/api-docs
springdoc.swagger-ui.path=/api/devices/swagger-ui.html

logging.level.root=INFO
logging.level.ro.tuc=DEBUG
