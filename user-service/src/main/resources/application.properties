server.port=${PORT:8080}

# --- Database (overridden by environment variables in Docker) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/user_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- Synchronization Broker (RabbitMQ): this service publishes user.created / user.updated / user.deleted ---
spring.rabbitmq.host=${SYNC_MQ_HOST:localhost}
spring.rabbitmq.port=${SYNC_MQ_PORT:5673}
spring.rabbitmq.username=${SYNC_MQ_USER:guest}
spring.rabbitmq.password=${SYNC_MQ_PASSWORD:guest}
app.rabbit.sync.exchange=sync.events

# --- Inter-service communication (Docker network DNS name) ---
auth.service.url=${AUTH_SERVICE_URL:http://localhost:8083}

# --- Bootstrap administrator (created at startup if missing) ---
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:}

# --- Swagger: paths live under /api/users so the reverse proxy rule PathPrefix(/api/users) covers them ---
springdoc.api-docs.path=/api/users/v3/api-docs
springdoc.swagger-ui.path=/api/users/swagger-ui.html

logging.level.root=INFO
logging.level.ro.tuc=DEBUG
